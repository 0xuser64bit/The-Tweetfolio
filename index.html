<!doctype html>
<html lang="en" class="theme-lights-out">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Arth Prajapati (user64bit.wtf) — Full-stack developer. Web3, AI, open source. Read-only JSON API at /api/v1, OpenAPI spec at /openapi.json, Markdown at /index.md."
    />
    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="c50da7aa-b136-4d04-90b5-261619d2eb40"
    ></script>

    <!-- Open Graph -->
    <meta property="og:title" content="Arth Prajapati (@user64bit) / X-folio" />
    <meta
      property="og:description"
      content="Full-stack developer. Ex-Odoo. Web3 & AI. Open source contributor."
    />
    <meta property="og:image" content="https://user64bit.wtf/og-image.png" />
    <meta property="og:url" content="https://user64bit.wtf" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TweetFolio" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@user64bit" />
    <meta name="twitter:creator" content="@user64bit" />
    <meta name="twitter:title" content="Arth Prajapati" />
    <meta
      name="twitter:description"
      content="Full-stack developer portfolio styled like X. Check it out."
    />
    <meta name="twitter:image" content="https://user64bit.wtf/og-image.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Canonical -->
    <link rel="canonical" href="https://user64bit.wtf" />

    <!-- Machine-readable alternates for AI agents and crawlers -->
    <link
      rel="alternate"
      type="text/markdown"
      href="https://user64bit.wtf/index.md"
      title="Markdown"
    />
    <link
      rel="alternate"
      type="text/plain"
      href="https://user64bit.wtf/llms.txt"
      title="llms.txt"
    />
    <link
      rel="service-desc"
      type="application/json"
      href="https://user64bit.wtf/openapi.json"
      title="OpenAPI"
    />

    <link rel="manifest" href="/manifest.json" />
    <title>Arth Prajapati (@user64bit) — Developer Portfolio</title>
    <!-- Runs before first paint: marks the document as scripted so `index.css`
         can hide the loading overlay for no-JS clients, and applies the saved
         theme so hydration never flashes the wrong palette. -->
    <script>
      (function () {
        var root = document.documentElement;
        root.classList.add("js");
        try {
          var saved = localStorage.getItem("tweetfolio-theme");
          if (saved === "dim" || saved === "light" || saved === "lights-out") {
            root.classList.remove(
              "theme-lights-out",
              "theme-dim",
              "theme-light",
            );
            root.classList.add("theme-" + saved);
            var meta = document.querySelector('meta[name="theme-color"]');
            var colors = {
              "lights-out": "#000000",
              dim: "#15202b",
              light: "#ffffff",
            };
            if (meta) meta.setAttribute("content", colors[saved]);
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
